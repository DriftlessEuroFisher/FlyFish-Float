# Pings the Supabase project every 3 days so the free tier never sits idle
# for the week that pauses it. Needs supabase/keepalive.sql run once.
# If the ping fails (project paused, or the function missing), the job fails
# and GitHub emails the repo owner: that email is the "go click Restore" alert.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 15 */3 * *"   # every 3 days, 15:17 UTC
  workflow_dispatch:           # "Run workflow" button for a manual test
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          # URL and public key come from the app's own config, so there is one source
          URL=$(sed -n 's/.*url:"\([^"]*\)".*/\1/p' js/config.js)
          KEY=$(sed -n 's/.*anonKey:"\([^"]*\)".*/\1/p' js/config.js)
          code=$(curl -s -o out.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keepalive" \
                 -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat out.txt)"
          test "$code" = "200"
